version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: focuspet-db
    environment:
      POSTGRES_DB: focuspetdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U focuspet"]
      interval: 10s
      timeout: 5s
      retries: 5

  focuspet-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: focuspet-api
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/focuspetdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
