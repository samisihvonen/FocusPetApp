spring.application.name=focuspet-backend
server.port=8080

# Database — PostgreSQL (update for production)
spring.datasource.url=jdbc:postgresql://postgres:5432/focuspetdb
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=focuspet
spring.datasource.password=focuspet_dev_password_123

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.root=INFO
logging.level.com.focuspet=DEBUG

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
